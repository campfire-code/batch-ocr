<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><title>OCR 自检（开发用）</title></head>
<body><pre id="out">running</pre><div id="imgs"></div><script type="module">
import { recognize } from '/src/tool/ocr.ts';
// 合成一张「截图」：白底上几行中文、数字和英文，第三行稍微倾斜
function draw(flip) {
  const c = document.createElement('canvas'); c.width = 1000; c.height = 520;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, 1000, 520);
  if (flip) { g.translate(1000, 520); g.rotate(Math.PI); }
  g.fillStyle = '#111'; g.textBaseline = 'top';
  g.font = 'bold 56px "PingFang SC", "Microsoft YaHei", sans-serif'; g.fillText('篝火开源工具箱 2026', 60, 50);
  g.font = '36px "PingFang SC", "Microsoft YaHei", sans-serif'; g.fillText('批量图片 OCR，离线识别，导出 Excel', 60, 160);
  g.save(); g.translate(60, 260); g.rotate(-0.04); g.fillText('订单号：3712024102300010001', 0, 0); g.restore();
  g.font = '32px "PingFang SC", sans-serif'; g.fillStyle = '#333'; g.fillText('左边一段', 60, 400); g.fillText('右边一段 ¥128.50', 560, 400);
  return c;
}
const toBytes = async (c) => new Uint8Array(await (await new Promise((r) => c.toBlob(r, 'image/png'))).arrayBuffer());
const res = [];
const t0 = performance.now();
const r = await recognize(await toBytes(draw(false)), { useCls: false, minScore: 0.5 });
res.push(`正常图片 ${r.width}x${r.height}，${r.lines.length} 行，耗时 ${Math.round(performance.now() - t0)}ms`);
for (const l of r.lines) res.push(`  ${l.text}  (${l.score.toFixed(3)})`);
const t1 = performance.now();
const f = await recognize(await toBytes(draw(true)), { useCls: true, minScore: 0.5 });
res.push(`倒置图片 + 方向分类：${f.lines.length} 行，耗时 ${Math.round(performance.now() - t1)}ms`);
for (const l of f.lines) res.push(`  ${l.text}  (${l.score.toFixed(3)})`);
const blank = document.createElement('canvas'); blank.width = 400; blank.height = 300; const bg = blank.getContext('2d'); bg.fillStyle = '#fff'; bg.fillRect(0, 0, 400, 300);
const b = await recognize(await toBytes(blank), { useCls: false, minScore: 0.5 });
res.push(`空白图片：${b.lines.length} 行`);
try { await recognize(new Uint8Array([1, 2, 3]), { useCls: false, minScore: 0.5 }); res.push('损坏图片：没有报错'); } catch (e) { res.push('损坏图片：' + e.message); }
// samples/ 示例（只有开发服务能访问到，正式构建里跳过）
for (const [name, cls] of [['商品说明-截图.png', false], ['倒置的便签.jpg', false], ['倒置的便签.jpg', true]]) {
  const resp = await fetch('/samples/' + encodeURIComponent(name));
  if (!resp.ok || !(resp.headers.get('content-type') || '').startsWith('image')) { res.push(`示例 ${name}：跳过（当前服务没有 samples/）`); continue; }
  const s = await recognize(new Uint8Array(await resp.arrayBuffer()), { useCls: cls, minScore: 0.5 });
  res.push(`示例 ${name}${cls ? '（纠正倒置）' : ''}：${s.lines.length} 行`);
  for (const l of s.lines) res.push(`  ${l.text}  (${l.score.toFixed(3)})`);
}
document.getElementById('imgs').append(draw(false));
document.getElementById('out').textContent = res.join('\n');
</script></body></html>
